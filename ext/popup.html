<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PokéTicker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="logo" aria-hidden="true"></div>
    <div class="head-text">
      <h1>PokéTicker</h1>
      <p class="subtitle">Card prices, like a stock ticker</p>
    </div>
    <button id="themeToggle" class="icon-btn" type="button" title="Toggle light/dark theme" aria-label="Toggle theme">☀️</button>
    <button id="refresh" class="icon-btn" type="button" title="Refresh all quotes" aria-label="Refresh all quotes">⟳</button>
  </header>

  <div class="tape-wrap" id="tape-wrap" hidden>
    <div class="tape-label" aria-hidden="true">WATCHLIST</div>
    <div class="tape-viewport" id="tape" role="marquee" aria-label="Watched card prices"></div>
  </div>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search a card… e.g. Charizard" aria-label="Search Pokémon cards" autocomplete="off" spellcheck="false">
    <button id="go" class="btn" type="button">Search</button>
    <div id="results" class="results" hidden></div>
    <div id="recentSearches" class="recent-searches"></div>
  </div>

  <div class="list-head">
    <span class="list-title">Your cards</span>
    <span id="portfolio" class="portfolio"></span>
    <select id="sortBy" class="sort-select" aria-label="Sort watchlist">
      <option value="added">Added</option>
      <option value="name">Name A–Z</option>
      <option value="price-desc">Price ↓</option>
      <option value="price-asc">Price ↑</option>
      <option value="trend-desc">Gainers ↓</option>
      <option value="trend-asc">Losers ↑</option>
    </select>
    <button id="compactToggle" class="text-btn" type="button" title="Toggle compact view">📏</button>
    <button id="clear-all" class="text-btn" type="button" hidden>Clear all</button>
    <button id="copyAll" class="text-btn" type="button" title="Copy all prices to clipboard" hidden>📋 All</button>
    <button id="copyClip" class="text-btn" type="button" title="Copy watchlist to clipboard" hidden>📋 Copy</button>
    <button id="exportCsv" class="text-btn" type="button" title="Export watchlist as CSV" hidden>📥 CSV</button>
  </div>

  <main id="list" class="list" aria-label="Watched cards"></main>

  <div id="empty" class="empty" hidden>
    <p>🔍 Search a card above to start your ticker.</p>
  </div>

  <div class="status-row">
    <span id="refreshAge" class="refresh-age"></span>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button id="snoozeBtn" class="retry-btn snooze-btn" type="button" title="Snooze alerts for 1 hour">🔕 Snooze</button>
    <button id="retry" class="retry-btn" type="button" hidden>⟳ Retry now</button>
    <button id="alertLogBtn" class="alert-log-btn" type="button" title="Alert history (24h)">📋</button>
  </div>
  <div id="alertLogPanel" class="alert-log-panel" hidden></div>

  <div id="ctxMenu" class="ctx-menu" hidden>
    <button data-action="copy-price" class="ctx-item">📋 Copy price</button>
    <button data-action="copy-name" class="ctx-item">📝 Copy name</button>
    <button data-action="remove" class="ctx-item ctx-danger">✕ Remove</button>
  </div>

  <div id="sparkTooltip" class="spark-tooltip" hidden></div>
  <div id="chartTooltip" class="chart-tooltip" hidden></div>

  <!-- chart overlay -->
  <div id="chartOverlay" class="chart-overlay" role="dialog" aria-modal="true" aria-labelledby="chartOverlayTitle" aria-describedby="chartOverlayMeta" tabindex="-1" hidden>
    <div class="chart-overlay-inner">
      <div class="chart-overlay-head">
        <span id="chartOverlayTitle">Price Chart</span>
        <button id="chartOverlayClose" class="overlay-close" type="button" aria-label="Close price chart">✕</button>
      </div>
      <div class="chart-overlay-tools" id="chartOverlayTools" role="group" aria-label="Chart time range"></div>
      <canvas id="chartOverlayCanvas" tabindex="0" role="img" aria-describedby="chartOverlayMeta"></canvas>
      <div class="chart-overlay-meta" id="chartOverlayMeta" role="status" aria-live="polite">Use the arrow keys on the chart to inspect prices.</div>
    </div>
  </div>

  <footer class="footer">
    <a class="report" href="mailto:contactae2000@gmail.com?subject=Bug+report%3A+Pok%C3%A9Ticker&amp;body=Extension%3A+Pok%C3%A9Ticker%0A%0A1.+What+happened%3A%0A2.+What+you+expected%3A%0A3.+How+to+reproduce%3A%0A4.+Browser+%2F+OS%3A" title="Report a problem with PokéTicker">🐞 Report a bug</a>
    <div class="support-foot">
      <a class="coffee" href="https://www.buymeacoffee.com/contactae2b" target="_blank" rel="noopener">☕ Buy me a coffee</a>
      <span class="ad-slot" title="Reserved layout space, not an advertisement">Your ad here · contactae2000@gmail.com</span>
    </div>
    <div class="support-foot">
      <span class="ad-slot" title="Reserved layout space, not an advertisement">Ad slot 2 · contactae2000@gmail.com</span>
    </div>
  </footer>

  <div id="health" style="position:fixed;bottom:4px;right:6px;z-index:999;font:9px monospace;color:#f87171;background:rgba(0,0,0,0.8);padding:2px 6px;border-radius:4px;">LOADING</div>
  <script src="cards.js"></script>
  <script src="popup.js"></script>
</body>
</html>
